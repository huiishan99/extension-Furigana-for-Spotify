name: Compatibility canary

on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-release-and-fixtures:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Verify canonical Release endpoint
        shell: pwsh
        run: |
          $latestUrl = "https://github.com/huiishan99/spotify-furigana/releases/latest"
          $response = Invoke-WebRequest -Uri $latestUrl -Headers @{ "User-Agent" = "FuriganaForSpotify/compatibility-canary" } -TimeoutSec 15 -UseBasicParsing
          $baseResponse = $response.BaseResponse
          if ($baseResponse.PSObject.Properties.Name -contains "ResponseUri") {
            $resolvedUrl = [string]$baseResponse.ResponseUri.AbsoluteUri
          } elseif ($baseResponse.PSObject.Properties.Name -contains "RequestMessage") {
            $resolvedUrl = [string]$baseResponse.RequestMessage.RequestUri.AbsoluteUri
          } else {
            throw "Could not resolve the latest GitHub Release URL."
          }
          if ($resolvedUrl -notmatch '^https://github\.com/huiishan99/spotify-furigana/releases/tag/v\d+\.\d+\.\d+/?$') {
            throw "Release endpoint redirected outside the canonical repository: $resolvedUrl"
          }

      - name: Install dependencies
        run: npm ci

      - name: Run DOM fixtures and maintenance checks
        run: npm run check
