name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Stable package version without v (for example 0.6.3)"
        required: true
        type: string
      expected_sha:
        description: "Full SHA of the tested main commit to release"
        required: true
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  prepare:
    name: Validate release request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate version, main commit, and release absence
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/release-preflight.mjs

  macos-overlay:
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and self-test universal macOS overlay
        run: sh scripts/build-macos-overlay.sh --universal

      - name: Upload macOS overlay
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-overlay
          path: build/macos-overlay/FuriganaForSpotifyOverlay
          if-no-files-found: error

  release:
    needs: [prepare, macos-overlay]
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile and test
        run: npm run check

      - name: Download macOS overlay
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-overlay
          path: build/macos-overlay

      - name: Build and verify release packages
        run: npm run package

      - name: Attest release package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.zip
            release/*.exe
            release/*.sha256

      # Recheck immediately before publication, including drafts with the write-scoped token.
      - name: Recheck release target before publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/release-preflight.mjs

      # GitHub's workflow token creates the tag without triggering a second tag-push run.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Furigana for Spotify ${{ needs.prepare.outputs.tag }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          body_path: docs/releases/${{ needs.prepare.outputs.tag }}.md
          overwrite_files: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            release/*.zip
            release/*.exe
            release/*.sha256
